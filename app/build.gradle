apply plugin: 'com.android.application'

// The Google Maps API key is not committed; it lives in local.properties.
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}

android {
    namespace 'com.bugfuzz.android.projectwalrus'

    compileSdk 35

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.bugfuzz.android.projectwalrus"
        minSdk 21
        targetSdk 27
        versionCode 4
        versionName "0.2.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        resValue "string", "google_maps_key",
                (localProperties.getProperty("GOOGLE_MAPS_API_KEY")
                        ?: project.findProperty("GOOGLE_MAPS_API_KEY") ?: "")
    }

    buildFeatures {
        dataBinding true
        buildConfig true
    }

    if (new File("../walrus-keystore.properties").exists()) {
        def keystorePropertiesFile = rootProject.file("../walrus-keystore.properties")
        def keystoreProperties = new Properties()
        keystoreProperties.load(new FileInputStream(keystorePropertiesFile))

        signingConfigs {
            config {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (new File("../walrus-keystore.properties").exists())
                signingConfig signingConfigs.config
        }
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    // Aligns kotlin-stdlib / -jdk7 / -jdk8 so the pre-1.8 split artifacts
    // pulled in transitively do not collide with kotlin-stdlib.
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')

    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.fragment:fragment:1.8.5'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.7'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.7'
    implementation 'androidx.localbroadcastmanager:localbroadcastmanager:1.1.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.google.guava:guava:33.3.1-android'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation 'com.github.felHR85:UsbSerial:6.1.0'
    implementation 'com.google.android.gms:play-services-location:21.3.0'
    implementation 'com.google.android.gms:play-services-maps:19.0.0'
    // ormlite-android 6.x bundles ormlite-core; declaring both duplicates every class.
    implementation 'com.j256.ormlite:ormlite-android:6.1'
    implementation 'com.leinardi.android:speed-dial:3.3.0'
    implementation 'org.apache.commons:commons-lang3:3.17.0'
    implementation 'org.parceler:parceler-api:1.1.6'
    implementation 'pub.devrel:easypermissions:3.0.0'

    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'

    annotationProcessor 'org.parceler:parceler:1.1.6'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
